[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "akool-modelhub-cli"
version = "0.2.0"
description = "AKOOL Model Hub cli"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["akool-modelhub-sdk==0.1.0", "jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/AKOOL-Official/model-hub-cli"
Issues = "https://github.com/AKOOL-Official/model-hub-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/akool_modelhub_cli"]

[tool.hatch.build.targets.wheel.force-include]
"install.sh" = "akool_modelhub_cli/install.sh"

[project.scripts]
akool-mh = "akool_modelhub_cli.main:entrypoint"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.16,<1", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
